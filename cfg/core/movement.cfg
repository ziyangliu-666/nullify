// ============================================================
// core/movement.cfg — low-level movement primitives
//
// Uses Source engine joystick axis commands instead of +forward/-forward.
// Axis commands allow applying and cancelling directional force in the
// same frame, enabling frame-precise counter-strafing.
//
// Axis command syntax:  <direction> <value> 0 0
//   value is clamped to [-1, 1] by the engine.
//   > 1  → treated as  1  (full force)
//   < -1 → treated as -1  (full cancel)
//   We use 99 / -99 as safe margins since the clamping is engine-internal
//   and undocumented — any value outside [-1,1] saturates to the boundary.
// ============================================================

// --- Apply movement (cancel opposite axis first, then apply) ---
alias mv_fwd   "back  -999 0 0;forward  1 0 0"
alias mv_back  "forward -999 0 0;back   1 0 0"
alias mv_left  "right  -999 0 0;left    1 0 0"
alias mv_right "left   -999 0 0;right   1 0 0"

// --- Cancel movement ---
alias mv_stop_fb  "forward -999 0 0;back  -999 0 0"
alias mv_stop_lr  "right   -999 0 0;left  -999 0 0"
alias mv_stop_all "mv_stop_fb;mv_stop_lr"
