// ============================================================
// core/ticker.cfg — per-frame loop infrastructure
//
// Entry: .vtest calls &r every frame via -testscript mechanism
//
//   &r  — root callback, fires every frame
//   &t  — half-rate tick (every 2 frames), registered by lunpan
//   &o  — per-frame logic hooks, registered by jiting
//   &k  — 6-frame tick, registered by jiting (drives timer state machines)
// ============================================================

alias &r "&t0;&o;&k0"

// &t: fires every 2 frames
alias &t0 "&t1"
alias &t1 "alias &t0 &t2"
alias &t2 "&t;alias &t0 &t1"

// &k: fires every 6 frames
alias &k0 "&k1"
alias &k1 "alias &k0 &k2"
alias &k2 "alias &k0 &k3"
alias &k3 "alias &k0 &k4"
alias &k4 "alias &k0 &k5"
alias &k5 "alias &k0 &k6"
alias &k6 "&k;alias &k0 &k1"

// Default no-ops — overwritten by their respective modules
alias &t
alias &o
alias &k
