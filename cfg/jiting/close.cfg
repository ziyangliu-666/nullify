// ============================================================
// jiting/close.cfg — disable counter-strafe
// Called by: close_jiting (user command)
// Restores direct key→movement bindings, no frame-event indirection.
// ============================================================

alias +fwd_key  "+forward"
alias -fwd_key  "forward -999 0 0"
alias +back_key "+back"
alias -back_key "back -999 0 0"
alias +left_key  "+left"
alias -left_key  "left -999 0 0"
alias +right_key "+right"
alias -right_key "right -999 0 0"

cl_hud_color 4   // visual feedback: jiting inactive
