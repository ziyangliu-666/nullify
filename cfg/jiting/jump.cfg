// ============================================================
// jiting/jump.cfg — air/ground state management
//
// Patches +_jump to load air.cfg and start a landing timer.
// The timer (72 &o ticks) fires ground.cfg when landing is expected.
//
// Exec'd by: engine.cfg load defaults (after ground.cfg)
// ============================================================

// Override base jump aliases to add state management
alias +_jump "+jump;exec nullify/jiting/air.cfg;alias evt_jump jmp_t1"
alias -_jump "jump -999 0 0"

// Landing timer: 72 frames via evt_jump (&o fires every frame)
// At frame 72, restores ground state and disarms
