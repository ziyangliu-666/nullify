// ============================================================
// jiting/ground.cfg — ground movement state
//
// Redefines stop_fb_action and stop_lr_action so that when a
// FB counter-strafe fires, lateral key releases apply the
// opposing lateral direction (cross-axis counter-strafe).
//
// Called by: +_jump on landing (via tmr_jump chain reset)
// ============================================================

// FB transition fires → stop FB, then configure LR release to counter-strafe
alias stop_fb_action "mv_stop_fb;alias socd_left_rel mv_right;alias socd_right_rel mv_left"

// LR transition fires → stop LR, then configure FB release to counter-strafe
alias stop_lr_action "mv_stop_lr;alias socd_fwd_rel mv_back;alias socd_back_rel mv_fwd"

// Reset lateral counter-strafe routing back to SOCD-driven (called after stop completes)
alias stop_cross_reset_fb "alias socd_left_rel;alias socd_right_rel"
alias stop_cross_reset_lr "alias socd_fwd_rel;alias socd_back_rel"
