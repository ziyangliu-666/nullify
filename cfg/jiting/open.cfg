// ============================================================
// jiting/open.cfg — enable counter-strafe
// Called by: open_jiting (user command)
// ============================================================

alias +fwd_key "+jt_fwd"
alias -fwd_key "-jt_fwd"
alias +back_key "+jt_back"
alias -back_key "-jt_back"
alias +left_key "+jt_left"
alias -left_key "-jt_left"
alias +right_key "+jt_right"
alias -right_key "-jt_right"

cl_hud_color 1   // visual feedback: jiting active
