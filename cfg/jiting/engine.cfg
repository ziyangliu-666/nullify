// ============================================================
// jiting/engine.cfg — counter-strafe engine
//
// Registers &o and &k into the frame loop.
// Defines WASD event hooks and the direction state machine.
//
// Per-frame (&o):  evt_fwd;evt_back;evt_left;evt_right;evt_switch;evt_sprint;evt_jump
// Per-6f  (&k):   drives all directional timer state machines
// ============================================================

// --- Register into frame loop ---
alias &o "evt_fwd;evt_back;evt_left;evt_right;evt_switch;evt_sprint;evt_jump"
alias &k "tmr_fwd_tick;tmr_back_tick;tmr_left_tick;tmr_right_tick;tmr_f2b_tick;tmr_b2f_tick;tmr_l2r_tick;tmr_r2l_tick;tmr_jump_tick"

// --- Per-frame event hooks (default: no-op, set by key press/release) ---
alias evt_fwd
alias evt_back
alias evt_left
alias evt_right
alias evt_switch
alias evt_sprint
alias evt_jump

// --- Timer tick starters (default: no-op, armed when key is held) ---
alias tmr_fwd_tick
alias tmr_back_tick
alias tmr_left_tick
alias tmr_right_tick
alias tmr_f2b_tick
alias tmr_b2f_tick
alias tmr_l2r_tick
alias tmr_r2l_tick
alias tmr_jump_tick

// --- Direction press/release handlers ---
// Layer 0: raw movement + timer init (called by SOCD state machine)
// Layer 1: event hook wrappers (registered into evt_* by key binds)
// Layer 2: SOCD wrappers (called by user keys, manage opposing-key state)

// Layer 1: event hook registration (used when jiting is ON)
alias +jt_fwd  "alias evt_fwd +jt_fwd_inner"
alias -jt_fwd  "alias evt_fwd -jt_fwd_inner;forward -999 0 0"
alias +jt_back "alias evt_back +jt_back_inner"
alias -jt_back "alias evt_back -jt_back_inner;back -999 0 0"
alias +jt_left  "alias evt_left +jt_left_inner"
alias -jt_left  "alias evt_left -jt_left_inner;left -999 0 0"
alias +jt_right "alias evt_right +jt_right_inner"
alias -jt_right "alias evt_right -jt_right_inner;right -999 0 0"

// Layer 1 inner: apply movement + start timer (populated by jiting/mode/*.cfg)
alias +jt_fwd_inner
alias -jt_fwd_inner
alias +jt_back_inner
alias -jt_back_inner
alias +jt_left_inner
alias -jt_left_inner
alias +jt_right_inner
alias -jt_right_inner

// --- Feature toggle entry points ---
exec <name>/jiting/open.cfg
exec <name>/jiting/detect.cfg
