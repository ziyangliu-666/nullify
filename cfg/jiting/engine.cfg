// ============================================================
// jiting/engine.cfg — counter-strafe engine
//
// Load order within this file:
//   1. Register &o and &k into the frame loop
//   2. Per-frame event hooks (evt_*)
//   3. Timer tick arming stubs
//   4. Movement press/release layers (L0→L1→L2→SOCD)
//   5. SOCD state machine
//   6. Timer counter state machine
//   7. Feature toggle aliases
// ============================================================

// --- 1. Register into frame loop ---
alias &o "evt_fwd;evt_back;evt_left;evt_right;evt_switch;evt_sprint;evt_jump;jt_pending"
alias jt_pending  // no-op by default; set by jump-throw on keydown
alias &k "tmr_fwd_arm;tmr_back_arm;tmr_left_arm;tmr_right_arm;tmr_f2b_arm;tmr_b2f_arm;tmr_l2r_arm;tmr_r2l_arm;tmr_jump_arm"

// --- 2. Per-frame event hooks (default no-op, set by key press/release) ---
alias evt_fwd
alias evt_back
alias evt_left
alias evt_right
alias evt_switch
alias evt_sprint
alias evt_jump

// --- 3. Timer arm stubs (default no-op, activated when direction held) ---
alias tmr_fwd_arm
alias tmr_back_arm
alias tmr_left_arm
alias tmr_right_arm
alias tmr_f2b_arm
alias tmr_b2f_arm
alias tmr_l2r_arm
alias tmr_r2l_arm
alias tmr_jump_arm

// --- 4a. Layer 0 — raw movement + timer init ---
// Called by SOCD state machine on actual key transitions.

alias +dir_fwd  "mv_fwd;tmr_fwd_v1_init;alias tmr_f2b_arm"
alias -dir_fwd  "mv_stop_fb;tmr_f2b_init;alias tmr_fwd_arm"

alias +dir_back "mv_back;tmr_back_v1_init;alias tmr_b2f_arm"
alias -dir_back "mv_stop_fb;tmr_b2f_init;alias tmr_back_arm"

alias +dir_left  "mv_left;tmr_left_v1_init;alias tmr_l2r_arm"
alias -dir_left  "mv_stop_lr;tmr_l2r_init;alias tmr_left_arm"

alias +dir_right "mv_right;tmr_right_v1_init;alias tmr_r2l_arm"
alias -dir_right "mv_stop_lr;tmr_r2l_init;alias tmr_right_arm"

// Direction-change variant (already moving, opposite pressed)
alias +dir_fwd_dc  "mv_fwd;tmr_fwd_v2_init;alias tmr_f2b_arm"
alias +dir_back_dc "mv_back;tmr_back_v2_init;alias tmr_b2f_arm"
alias +dir_left_dc  "mv_left;tmr_left_v2_init;alias tmr_l2r_arm"
alias +dir_right_dc "mv_right;tmr_right_v2_init;alias tmr_r2l_arm"

// --- 4b. Layer 1 — frame-event indirection (jiting ON path) ---
// +key registers the press into evt_*, fires once next &o tick.
// -key registers the release, immediately cancels axis.

alias +jt_fwd  "alias evt_fwd +dir_fwd_evt"
alias -jt_fwd  "alias evt_fwd;forward -99 0 0"
alias +jt_back "alias evt_back +dir_back_evt"
alias -jt_back "alias evt_back;back -99 0 0"
alias +jt_left  "alias evt_left +dir_left_evt"
alias -jt_left  "alias evt_left;left -99 0 0"
alias +jt_right "alias evt_right +dir_right_evt"
alias -jt_right "alias evt_right;right -99 0 0"

// evt_* one-shot handlers — fire then clear themselves
alias +dir_fwd_evt  "+dir_fwd;alias evt_fwd"
alias +dir_back_evt "+dir_back;alias evt_back"
alias +dir_left_evt  "+dir_left;alias evt_left"
alias +dir_right_evt "+dir_right;alias evt_right"

// --- 5. SOCD state machine ---
// Tracks which directions are held and routes to L0 correctly.
// States per axis pair (FB / LR):
//   idle          → no key held
//   fwd_held      → only forward
//   back_held     → only back
//   fwd_then_back → forward held, back added  (direction change)
//   back_then_fwd → back held, forward added

// FB axis — initial state: idle
alias socd_fwd_press  "socd_fb_fwd1"
alias socd_back_press "socd_fb_back1"

// Forward pressed first
alias socd_fb_fwd1 "+dir_fwd;alias socd_fwd_press socd_fb_fwd1_redo;alias socd_back_press socd_fb_fwd_back;alias socd_fwd_rel socd_fb_fwd1_rel"
alias socd_fb_fwd1_rel "-dir_fwd;alias socd_fwd_press socd_fb_fwd1;alias socd_back_press socd_fb_back1;alias socd_fwd_rel"
alias socd_fb_fwd1_redo "+dir_fwd"   // re-press while still holding: refresh

// Back added while forward held (direction change)
alias socd_fb_fwd_back "+dir_back_dc;mv_stop_fb;alias socd_back_press;alias socd_back_rel socd_fb_fwd_back_rel;alias socd_fwd_rel socd_fb_fwd_back_frel"
alias socd_fb_fwd_back_rel "-dir_back;+dir_fwd;alias socd_back_press socd_fb_fwd_back;alias socd_back_rel;alias socd_fwd_rel socd_fb_fwd1_rel"
alias socd_fb_fwd_back_frel "-dir_fwd;alias socd_fwd_press socd_fb_fwd1;alias socd_back_press socd_fb_back1;alias socd_fwd_rel;alias socd_back_rel"

// Back pressed first
alias socd_fb_back1 "+dir_back;alias socd_back_press socd_fb_back1_redo;alias socd_fwd_press socd_fb_back_fwd;alias socd_back_rel socd_fb_back1_rel"
alias socd_fb_back1_rel "-dir_back;alias socd_fwd_press socd_fb_fwd1;alias socd_back_press socd_fb_back1;alias socd_back_rel"
alias socd_fb_back1_redo "+dir_back"

// Forward added while back held (direction change)
alias socd_fb_back_fwd "+dir_fwd_dc;mv_stop_fb;alias socd_fwd_press;alias socd_fwd_rel socd_fb_back_fwd_rel;alias socd_back_rel socd_fb_back_fwd_brel"
alias socd_fb_back_fwd_rel "-dir_fwd;+dir_back;alias socd_fwd_press socd_fb_back_fwd;alias socd_fwd_rel;alias socd_back_rel socd_fb_back1_rel"
alias socd_fb_back_fwd_brel "-dir_back;alias socd_fwd_press socd_fb_fwd1;alias socd_back_press socd_fb_back1;alias socd_fwd_rel;alias socd_back_rel"

// LR axis — mirrors FB
alias socd_left_press  "socd_lr_left1"
alias socd_right_press "socd_lr_right1"

alias socd_lr_left1 "+dir_left;alias socd_left_press socd_lr_left1_redo;alias socd_right_press socd_lr_left_right;alias socd_left_rel socd_lr_left1_rel"
alias socd_lr_left1_rel "-dir_left;alias socd_left_press socd_lr_left1;alias socd_right_press socd_lr_right1;alias socd_left_rel"
alias socd_lr_left1_redo "+dir_left"

alias socd_lr_left_right "+dir_right_dc;mv_stop_lr;alias socd_right_press;alias socd_right_rel socd_lr_left_right_rel;alias socd_left_rel socd_lr_left_right_lrel"
alias socd_lr_left_right_rel "-dir_right;+dir_left;alias socd_right_press socd_lr_left_right;alias socd_right_rel;alias socd_left_rel socd_lr_left1_rel"
alias socd_lr_left_right_lrel "-dir_left;alias socd_left_press socd_lr_left1;alias socd_right_press socd_lr_right1;alias socd_left_rel;alias socd_right_rel"

alias socd_lr_right1 "+dir_right;alias socd_right_press socd_lr_right1_redo;alias socd_left_press socd_lr_right_left;alias socd_right_rel socd_lr_right1_rel"
alias socd_lr_right1_rel "-dir_right;alias socd_left_press socd_lr_left1;alias socd_right_press socd_lr_right1;alias socd_right_rel"
alias socd_lr_right1_redo "+dir_right"

alias socd_lr_right_left "+dir_left_dc;mv_stop_lr;alias socd_left_press;alias socd_left_rel socd_lr_right_left_rel;alias socd_right_rel socd_lr_right_left_rrel"
alias socd_lr_right_left_rel "-dir_left;+dir_right;alias socd_left_press socd_lr_right_left;alias socd_left_rel;alias socd_right_rel socd_lr_right1_rel"
alias socd_lr_right_left_rrel "-dir_right;alias socd_left_press socd_lr_left1;alias socd_right_press socd_lr_right1;alias socd_left_rel;alias socd_right_rel"

// SOCD release stubs (populated by SOCD state transitions above)
alias socd_fwd_rel
alias socd_back_rel
alias socd_left_rel
alias socd_right_rel

// --- 6. Key-to-SOCD wiring (used when jiting ON) ---
// +fwd_key / -fwd_key are what user/keys.cfg actually binds.

alias +fwd_key  "socd_fwd_press"
alias -fwd_key  "socd_fwd_rel"
alias +back_key "socd_back_press"
alias -back_key "socd_back_rel"
alias +left_key  "socd_left_press"
alias -left_key  "socd_left_rel"
alias +right_key "socd_right_press"
alias -right_key "socd_right_rel"

// --- 7. Feature toggle aliases ---
alias open_jiting  "exec nullify/jiting/open.cfg"
alias close_jiting "exec nullify/jiting/close.cfg"

alias jt_mode_1   "exec nullify/jiting/mode/m1.cfg"
alias jt_mode_1_5 "exec nullify/jiting/mode/m1_5.cfg"
alias jt_mode_2   "exec nullify/jiting/mode/m2.cfg"
alias jt_mode_3   "exec nullify/jiting/mode/m3.cfg"
alias jt_mode_4   "exec nullify/jiting/mode/m4.cfg"
alias jt_mode_5   "exec nullify/jiting/mode/m5.cfg"
alias jt_mode_6   "exec nullify/jiting/mode/m6.cfg"

alias open_bhop  "exec nullify/jiting/bhop.cfg"
alias close_bhop "alias +if_jump +_jump;alias -if_jump -_jump"

alias open_jumpbug  "exec nullify/jiting/jumpbug.cfg"
alias close_jumpbug "alias +if_jumpbug;alias -if_jumpbug"

// Jump aliases (overridden by bhop/jumpbug)
alias +_jump "+jump"
alias -_jump "jump -99 0 0"
alias +if_jump "+_jump"
alias -if_jump "-_jump"
alias +if_jumpbug
alias -if_jumpbug

// --- Load defaults ---
exec nullify/jiting/open.cfg
exec nullify/jiting/detect.cfg
exec nullify/jiting/ground.cfg
exec nullify/jiting/jump.cfg
