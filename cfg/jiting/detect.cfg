// ============================================================
// jiting/detect.cfg — weapon slot detection
// Bound to weapon switch keys in user/keys.cfg
// Each slot re-evaluates jiting state and fast-handgun mode.
// ============================================================

// Primary (slot 1): rifles — disable jiting
alias on_slot_1 "jiting_off_gun"

// Secondary (slot 2): pistols — enable jiting + fast handgun eligible
alias on_slot_2 "jiting_on_gun"

// Melee / utility / grenades (slots 3-5): enable jiting
alias on_slot_3 "jiting_on_gun"
alias on_slot_4 "jiting_on_gun"
alias on_slot_5 "jiting_on_gun"

// Generic detect (e, g, q — use/drop/lastinv)
alias on_slot_any "jiting_on_gun"

// --- Jiting-gun state helpers ---
// Populated by jiting/open.cfg and jiting/close.cfg as needed
alias jiting_off_gun
alias jiting_on_gun
