// ============================================================
// jiting/air.cfg — airborne movement state
//
// In the air, lateral key releases simply stop lateral movement
// rather than applying the opposing direction.
// Cross-axis counter-strafe is not meaningful during jumps.
//
// Called by: +_jump
// ============================================================

// FB transition fires → stop FB, lateral release just stops (no counter)
alias stop_fb_action "mv_stop_fb;alias socd_left_rel mv_stop_lr;alias socd_right_rel mv_stop_lr"

// LR transition fires → stop LR, FB release just stops
alias stop_lr_action "mv_stop_lr;alias socd_fwd_rel mv_stop_fb;alias socd_back_rel mv_stop_fb"

alias stop_cross_reset_fb "alias socd_left_rel;alias socd_right_rel"
alias stop_cross_reset_lr "alias socd_fwd_rel;alias socd_back_rel"
