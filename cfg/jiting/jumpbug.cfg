// ============================================================
// jiting/jumpbug.cfg — jump-bug technique
//
// Press the jumpbug key (+if_jumpbug) while near the ground:
//   Frame 0 : +jump (start jump)
//   Frame 1 : +duck, cancel jump axis
//   Frame 2 : cancel jump axis, restore ground state
//
// Exec'd by: open_jumpbug (defined in engine.cfg)
// ============================================================

// 2-frame sequence after the initial jump
alias jumpbug_t1 "+duck;jump -999 0 0;alias evt_jump jumpbug_t2"
alias jumpbug_t2 "jump -999 0 0;exec nullify/jiting/ground.cfg;alias evt_jump"

// Jumpbug key press: jump immediately, then run duck sequence via evt_jump
// +_jump sets air.cfg + jmp_t1; we immediately override evt_jump to jumpbug_t1
alias jumpbug_start "+_jump;alias evt_jump jumpbug_t1"

alias +if_jumpbug "jumpbug_start"
alias -if_jumpbug "duck -999 0 0"
