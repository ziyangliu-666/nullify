// ============================================================
// jiting/bhop.cfg — bunny-hop: continuous jump cycle while space held
//
// Locks fps_max to 64 for consistent timing.
// 8-frame cycle: jump+release on frame 1, idle for frames 2–8.
// Bypasses jump state manager (air/ground) — not meaningful during bhop.
//
// Exec'd by: open_bhop (defined in engine.cfg)
// ============================================================

// 8-frame jump cycle via evt_jump (&o fires every frame)
// 8-frame jump cycle via evt_jump (&o fires every frame)
alias bhop_t1 "+jump;jump -999 0 0;alias evt_jump bhop_t2"
alias bhop_t2 "alias evt_jump bhop_t3"
alias bhop_t3 "alias evt_jump bhop_t4"
alias bhop_t4 "alias evt_jump bhop_t5"
alias bhop_t5 "+jump;jump -999 0 0;alias evt_jump bhop_t6"
alias bhop_t6 "alias evt_jump bhop_t7"
alias bhop_t7 "alias evt_jump bhop_t8"
alias bhop_t8 "alias evt_jump bhop_t1"

// Apply FPS cap immediately on load (official servers block runtime fps_max changes).
// Also arm the cycle on key press; restore FPS on release or when bhop is closed.
bhop_apply_fps_cap
alias +if_jump "alias evt_jump bhop_t1"
alias -if_jump "alias evt_jump"
alias close_bhop "alias evt_jump;alias +if_jump +_jump;alias -if_jump -_jump;bhop_restore_fps"
