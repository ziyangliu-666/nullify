// ============================================================
// user/keys.cfg — key bindings, generated by the UI
// ============================================================

// --- Movement ---
bind w "+fwd_key"
bind s "+back_key"
bind a "+left_key"
bind d "+right_key"
bind space "+if_jump"
bind shift "+sprint"
bind ctrl  "+duck"

// --- Weapon slots (with detection) ---
bind 1 "slot1;on_slot_1"
bind 2 "slot2;on_slot_2"
bind 3 "slot3;on_slot_3"
bind 4 "slot4;on_slot_4"
bind 5 "slot5;on_slot_5"
bind e "+use;on_slot_any"
bind g "drop;on_slot_any"
bind q "lastinv;on_slot_any"

// --- Combat ---
bind mouse1 "+attack"
bind mouse2 "+attack2"

// --- Utility ---
bind v "toggle_jiting"
bind l "+if_jump_throw"
bind p "+if_fwd_jump_throw"
