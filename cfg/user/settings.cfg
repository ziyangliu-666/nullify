// ============================================================
// user/settings.cfg — generated by the UI, do not edit manually
// ============================================================

// --- Counter-strafe ---
open_jiting
jt_mode_3

// --- Features ---
close_bhop
close_jumpbug
close_jump_throw
close_fwd_jump_throw

// --- Sensitivity ---
alias usr_sensitivity        "sensitivity 2.5"
alias usr_m_yaw              "m_yaw 0.022"
alias usr_m_pitch            "m_pitch 0.022"
alias usr_sensitivity_y      "sensitivity_y_scale 1"
alias usr_spin_yaw           "yaw 3272.727272 1 1"   // 180° = 180 / (sens * m_yaw)

// Apply sensitivity
usr_sensitivity
usr_m_yaw
usr_m_pitch
usr_sensitivity_y

// --- HUD color feedback ---
alias hud_jiting_on  "cl_hud_color 1"
alias hud_jiting_off "cl_hud_color 4"
