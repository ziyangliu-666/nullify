// ============================================================
// lunpan/throw.cfg — jump-throw system
//
// Uses mouse axis rebinding to chain +jump and +attack
// as separate inputs, bypassing cl_allow_multi_input_binds 0.
// ============================================================

// Restore helpers
alias throw_restore_my "bind mouse_y pitch"
alias throw_restore_mx "bind mouse_x yaw"

// Jump-throw sequence
alias throw_fire    "+attack;bind mouse_y throw_restore_my"
alias throw_land    "throw_restore_mx;-jump"

alias +jump_throw   "+jump;bind mouse_y throw_fire"
alias -jump_throw   "-attack;bind mouse_x throw_land"

// Forward jump-throw (move forward during throw)
alias throw_fire_fwd "+fwd_key;+attack;bind mouse_y throw_restore_my"

alias +fwd_jump_throw  "+jump;bind mouse_y throw_fire_fwd"
alias -fwd_jump_throw  "-fwd_key;-attack;bind mouse_x throw_land"

// --- Feature toggles ---
alias open_jump_throw  "alias +if_jump_throw +jump_throw;alias -if_jump_throw -jump_throw"
alias close_jump_throw "alias +if_jump_throw;alias -if_jump_throw"

alias open_fwd_jump_throw  "alias +if_fwd_jump_throw +fwd_jump_throw;alias -if_fwd_jump_throw -fwd_jump_throw"
alias close_fwd_jump_throw "alias +if_fwd_jump_throw;alias -if_fwd_jump_throw"

// Default: both disabled (user enables via settings.cfg)
alias +if_jump_throw
alias -if_jump_throw
alias +if_fwd_jump_throw
alias -if_fwd_jump_throw
