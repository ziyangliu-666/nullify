// ============================================================
// lunpan/throw.cfg — jump-throw system
//
// Uses the per-frame ticker (jt_pending in &o) to fire +attack
// one frame after +jump, bypassing cl_allow_multi_input_binds 0
// without touching mouse axes.
// ============================================================

// --- Jump-throw ---
alias _jt_attack        "+attack; alias jt_pending"

alias +jump_throw       "+jump; alias jt_pending _jt_attack"
alias -jump_throw       "alias jt_pending; -attack"

// --- Forward jump-throw ---
alias _fjt_attack       "+attack; alias jt_pending"

alias +fwd_jump_throw   "+fwd_key; +jump; alias jt_pending _fjt_attack"
alias -fwd_jump_throw   "alias jt_pending; -fwd_key; -attack"

// --- Feature toggles ---
alias open_jump_throw       "alias +if_jump_throw +jump_throw; alias -if_jump_throw -jump_throw"
alias close_jump_throw      "alias +if_jump_throw; alias -if_jump_throw"

alias open_fwd_jump_throw   "alias +if_fwd_jump_throw +fwd_jump_throw; alias -if_fwd_jump_throw -fwd_jump_throw"
alias close_fwd_jump_throw  "alias +if_fwd_jump_throw; alias -if_fwd_jump_throw"

// Default: both disabled (user enables via settings.cfg)
alias +if_jump_throw
alias -if_jump_throw
alias +if_fwd_jump_throw
alias -if_fwd_jump_throw
