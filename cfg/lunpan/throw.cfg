// ============================================================
// lunpan/throw.cfg — jump-throw system
//
// Matches ForeverRise's 1-frame/2-frame jump-throw logic using
// sub-tick clearing syntax (jump -999, attack -999).
// ============================================================

// --- Base logic (internal actions) ---
alias _action_throw    "+attack; attack -999 0 0; attack2 -999 0 0"
alias _action_jump     "+jump; jump -999 0 0"
alias _action_jt       "_action_jump; _action_throw"

// --- Jump-throw ---
alias _jt_action        "_action_throw; jump -999 0 0; alias jt_pending"

alias +jump_throw       "+jump; alias jt_pending _jt_action"
alias -jump_throw       "jump -999 0 0"

// --- Forward jump-throw ---
alias _fjt_action       "+forward; _action_jt; alias jt_pending"

alias +fwd_jump_throw   "alias jt_pending _fjt_action"
alias -fwd_jump_throw   "forward -999 0 0"

// --- Feature toggles ---
alias open_jump_throw       "alias +if_jump_throw +jump_throw; alias -if_jump_throw -jump_throw"
alias close_jump_throw      "alias +if_jump_throw; alias -if_jump_throw"

alias open_fwd_jump_throw   "alias +if_fwd_jump_throw +fwd_jump_throw; alias -if_fwd_jump_throw -fwd_jump_throw"
alias close_fwd_jump_throw  "alias +if_fwd_jump_throw; alias -if_fwd_jump_throw"

// Default: both disabled (user enables via settings.cfg)
alias +if_jump_throw
alias -if_jump_throw
alias +if_fwd_jump_throw
alias -if_fwd_jump_throw
