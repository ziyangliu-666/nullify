[package]
name = "nullify"
version = "1.0.1"
edition = "2021"

[lib]
name = "nullify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[package.metadata.tauri]
windows-resource-file = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
