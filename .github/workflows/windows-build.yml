name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read app version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content "app/package.json" | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=nullify-v$version-windows-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build single-file exe
        working-directory: app
        run: npm run tauri build

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "app/src-tauri/target/release/nullify.exe" "dist-artifacts/${{ steps.meta.outputs.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset_name }}
          path: dist-artifacts/${{ steps.meta.outputs.asset_name }}
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: dist-artifacts/${{ steps.meta.outputs.asset_name }}
        run: |
          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_NAME --title $env:TAG_NAME --notes "Automated release for nullify $env:TAG_NAME"
          }
          gh release upload $env:TAG_NAME $env:ASSET_PATH --clobber
